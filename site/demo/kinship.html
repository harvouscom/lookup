<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kinship · Lookup example</title>
<meta name="description" content="A made-up church management app built with React, adding a partner church with Lookup.">
<script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Google+Sans+Flex:opsz,wght@6..144,400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="/demo/demo.css">
<style>
  body { background: #F6F6F8; color: #18181B; }
  .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
  .embed .shell { min-height: 100vh; }
  .side { display: flex; flex-direction: column; gap: 18px; padding: 14px 12px; background: #17142A; color: #CFCBE0; }
  .ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .ws-logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: #6D28D9; }
  .ws b { display: block; color: #fff; font-size: 14px; }
  .ws small { display: block; font-size: 12px; color: #9C97B4; }
  .side nav { display: grid; gap: 2px; }
  .side nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: #CFCBE0; text-decoration: none; font-size: 14px; }
  .side nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
  .side nav a[aria-current] { background: rgba(167,139,250,.18); color: #fff; }
  .side nav a svg { width: 16px; height: 16px; flex: none; }
  .side-h { margin: 0 0 4px; padding: 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8A85A3; }
  .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 8px; font-size: 13px; }
  .av { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 99px; background: #B45309; color: #fff; font-weight: 600; font-size: 12px; }
  .me small { display: block; color: #8A85A3; font-size: 12px; }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 24px; background: #fff; border-bottom: 1px solid #E7E6EC; }
  .top .find { display: flex; align-items: center; gap: 8px; width: min(340px, 40vw); height: 36px; padding: 0 12px; border-radius: 9px; background: #F4F4F6; color: #5F5F69; font-size: 14px; }
  .top .icons { margin-left: auto; display: flex; gap: 6px; color: #52525B; }
  .top .icons span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; }
  .top svg { width: 16px; height: 16px; flex: none; }
  .top .icons svg { width: 18px; height: 18px; }
  .top .find { white-space: nowrap; overflow: hidden; }
  .ci svg { width: 16px; height: 16px; }
  .page { padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; max-width: 1180px; width: 100%; }
  .crumbs { grid-column: 1 / -1; margin: 0 0 -6px; font-size: 13px; color: #5F5F69; }
  .crumbs span { margin: 0 6px; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .card { background: #fff; border: 1px solid #E7E6EC; border-radius: 14px; }
  form.card { padding: 22px; }
  .card h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card > p { margin: 0 0 18px; font-size: 13px; color: #71717A; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-top: 18px; }
  .grid .wide { grid-column: 1 / -1; }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: #3F3F46; }
  input, select, textarea { width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid #DCDBE3; border-radius: 9px; background: #fff; color: #18181B; font-size: 14px; }
  textarea { min-height: 72px; padding: 10px 12px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139,92,246,.2); }
  .sec { margin: 22px 0 0; padding-top: 18px; border-top: 1px solid #EFEEF3; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #8A879A; }
  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .actions output { margin-right: auto; font-size: 13px; color: #6D28D9; }
  .btn { min-height: 38px; padding: 0 16px; border-radius: 9px; border: 1px solid #DCDBE3; background: #fff; color: #18181B; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn.primary { border-color: #6D28D9; background: #6D28D9; color: #fff; }
  .btn.primary:hover { background: #5B21B6; }
  .btn:focus-visible { outline: 2px solid #8B5CF6; outline-offset: 2px; }
  .list { padding: 16px; }
  .list ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
  .list li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .list li.new { background: #F5F0FF; animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } }
  .list li b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list li small { display: block; font-size: 12px; color: #71717A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ci { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #EFE9FE; color: #6D28D9; }
  .tag { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: #ECFDF5; color: #047857; font-size: 11px; font-weight: 600; vertical-align: 1px; }
  church-lookup { --hmc-accent: #7C3AED; --hmc-active-bg: #F3EEFF; --hmc-radius: 10px; --hmc-input-border: #DCDBE3; --hmc-border: #E7E6EC; }
  church-lookup::part(label) { font-size: 13px; font-weight: 500; color: #3F3F46; }
  church-lookup::part(input) { min-height: 44px; font-size: 15px; }
  @media (max-width: 960px) { .page { grid-template-columns: 1fr; } }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } .side { display: none; } .grid { grid-template-columns: 1fr; } .top { padding: 0 14px; } .page { padding: 16px; } }
  @media (prefers-reduced-motion: reduce) { .list li.new { animation: none; } }
</style>
</head>
<body>
<a class="skip" href="#app">Skip to the app</a>
<aside class="demo-banner" aria-label="About this example"><b>Lookup example</b><span>Kinship is a made-up church management app built with React.</span><a href="/#examples">All examples</a></aside>
<div id="app"><p style="padding:24px">Loading the app…</p></div>
<aside class="demo-pill" aria-label="Demo mode"><img src="/brand/mark.svg" alt=""><span>Demo mode: nothing you share is sent</span><button type="button" id="dev-open" aria-expanded="false" aria-controls="dev">React state</button></aside>
<aside class="dev" id="dev" hidden aria-label="React state"><header>React state<button type="button" id="dev-close" aria-label="Close">×</button></header><pre id="state" aria-live="off">{}</pre></aside>
<script type="module" src="/element.js"></script>
<script type="module" src="/service-times.js"></script>
<script type="module">
import React, { useEffect, useRef, useState } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import htm from "https://esm.sh/htm@3.1.1";
const html = htm.bind(React.createElement);

const icon = (d) => html`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d=${d} /></svg>`;
const NAV = [
  ["Home", "M2.5 7.5 8 3l5.5 4.5V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5z"],
  ["People", "M6 7.5a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5zM2 13.5c0-2.2 1.8-4 4-4s4 1.8 4 4M11 3.2a2.2 2.2 0 0 1 0 4.2M12 9.7c1.2.5 2 1.9 2 3.8"],
  ["Groups", "M2.5 4.5h11v8h-11zM5.5 2.5v2M10.5 2.5v2"],
  ["Check-ins", "M3 8.5l3 3 7-7"],
  ["Giving", "M8 13.5S2.5 10.3 2.5 6.4A2.9 2.9 0 0 1 8 5a2.9 2.9 0 0 1 5.5 1.4C13.5 10.3 8 13.5 8 13.5z"],
  ["Partner churches", "M8 1.5v3M6.5 3h3M3.5 14V8L8 5l4.5 3v6M6.5 14v-3a1.5 1.5 0 0 1 3 0v3M2 14h12"],
];
const empty = { church_id: "", name: "", street: "", city: "", regionName: "", postalCode: "", website: "", phone: "", denomination: "", serviceTimes: "", relationship: "Partner", notes: "" };
const START = [
  { name: "Hope Community Church", where: "Austin, Texas", rel: "Church plant" },
  { name: "New Life Fellowship", where: "Tulsa, Oklahoma", rel: "Partner" },
  { name: "St. Andrew's Parish", where: "Columbus, Ohio", rel: "Sister church" },
];

function Field({ k, label, form, set, wide, ...rest }) {
  return html`<label class=${wide ? "wide" : ""}>${label}<input data-hmc-field=${k} name=${k} value=${form[k]} onChange=${(e) => set(k, e.target.value)} autocomplete="off" ...${rest} /></label>`;
}

function App() {
  const [form, setForm] = useState(empty);
  const [list, setList] = useState(START);
  const [saved, setSaved] = useState("");
  const ref = useRef(null);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  useEffect(() => {
    const el = ref.current;
    const pick = (e) => set("church_id", e.detail.result.id);
    const clear = () => set("church_id", "");
    el.addEventListener("church-select", pick);
    el.addEventListener("church-clear", clear);
    return () => { el.removeEventListener("church-select", pick); el.removeEventListener("church-clear", clear); };
  }, []);
  useEffect(() => { document.getElementById("state").textContent = JSON.stringify(form, null, 2); }, [form]);
  const submit = (e) => {
    e.preventDefault();
    if (!form.church_id) { setSaved("Choose a church from the list first."); ref.current.shadowRoot?.querySelector("input")?.focus(); return; }
    setList((l) => [{ name: form.name || "New church", where: [form.city, form.regionName].filter(Boolean).join(", "), rel: form.relationship, isNew: true }, ...l.map((x) => ({ ...x, isNew: false }))]);
    setSaved(`Saved ${form.name || "the church"} (${form.church_id}).`);
  };
  return html`<div class="shell">
    <aside class="side" aria-label="Kinship">
      <div class="ws"><span class="ws-logo"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="#fff" stroke-width="1.8" aria-hidden="true"><circle cx="6" cy="8" r="3.6"/><circle cx="10" cy="8" r="3.6"/></svg></span><span><b>Kinship</b><small>Westside Network</small></span></div>
      <nav aria-label="Main">
        <p class="side-h">Workspace</p>
        ${NAV.map(([n, d], i) => html`<a href="#" key=${n} aria-current=${i === 5 ? "page" : undefined} onClick=${(e) => e.preventDefault()}>${icon(d)}${n}</a>`)}
      </nav>
      <div class="me"><span class="av">JD</span><span>Jordan Diaz<small>Network admin</small></span></div>
    </aside>
    <div class="main">
      <header class="top"><span class="find">${icon("M7 12.5a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11zM14.5 14.5l-3.6-3.6")}Search people, groups, churches</span>
        <span class="icons" aria-hidden="true"><span>${icon("M8 2a4 4 0 0 0-4 4v3l-1.5 2.5h11L12 9V6a4 4 0 0 0-4-4zM6.5 13.5a1.5 1.5 0 0 0 3 0")}</span><span>${icon("M8 5.5v5M5.5 8h5")}</span></span></header>
      <main class="page" id="main">
        <p class="crumbs">Partner churches<span aria-hidden="true">/</span>New</p>
        <h1>Add a partner church</h1>
        <form class="card" onSubmit=${submit} noValidate>
          <h2>Church</h2>
          <p>Find the church and its details fill in from Here’s My Church. Anything you type is kept.</p>
          <church-lookup ref=${ref} name="church_id" client="lookup-demo" label="Find the church" placeholder="Search by name or city"></church-lookup>
          <div class="grid">
            <${Field} k="name" label="Church name" form=${form} set=${set} wide />
            <${Field} k="street" label="Street" form=${form} set=${set} wide />
            <${Field} k="city" label="City" form=${form} set=${set} />
            <${Field} k="regionName" label="State or region" form=${form} set=${set} />
            <${Field} k="website" label="Website" form=${form} set=${set} />
            <${Field} k="phone" label="Phone" form=${form} set=${set} />
            <${Field} k="denomination" label="Denomination" form=${form} set=${set} />
            <${Field} k="postalCode" label="Postal code" form=${form} set=${set} />
            <label class="wide">Service times<input data-hmc-field="serviceTimes" name="serviceTimes" value=${form.serviceTimes} onChange=${(e) => set("serviceTimes", e.target.value)} /></label>
          </div>
          <p class="sec">Relationship</p>
          <div class="grid">
            <label>Type<select value=${form.relationship} onChange=${(e) => set("relationship", e.target.value)}><option>Partner</option><option>Church plant</option><option>Sister church</option><option>Mission partner</option></select></label>
            <label class="wide">Notes<textarea value=${form.notes} onChange=${(e) => set("notes", e.target.value)} placeholder="How you work together"></textarea></label>
          </div>
          <div class="actions"><output aria-live="polite">${saved}</output><button type="button" class="btn" onClick=${() => { setForm(empty); setSaved(""); ref.current.clear?.(); }}>Cancel</button><button class="btn primary">Save church</button></div>
        </form>
        <section class="card list" aria-labelledby="list-h">
          <h2 id="list-h">Partner churches</h2>
          <ul>${list.map((c) => html`<li key=${c.name + c.where} class=${c.isNew ? "new" : ""}><span class="ci">${icon("M8 1.5v3M6.5 3h3M3.5 14V8L8 5l4.5 3v6M2 14h12")}</span><span><b>${c.name}${c.isNew ? html`<span class="tag">New</span>` : null}</b><small>${c.rel} · ${c.where || "—"}</small></span></li>`)}</ul>
        </section>
      </main>
    </div>
  </div>`;
}
createRoot(document.getElementById("app")).render(html`<${App} />`);

const dev = document.getElementById("dev"), openBtn = document.getElementById("dev-open");
openBtn.addEventListener("click", () => { dev.hidden = !dev.hidden; openBtn.setAttribute("aria-expanded", String(!dev.hidden)); });
document.getElementById("dev-close").addEventListener("click", () => { dev.hidden = true; openBtn.setAttribute("aria-expanded", "false"); openBtn.focus(); });
</script>
</body>
</html>
